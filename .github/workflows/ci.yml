name: CI

on:
  push:
    branches: [master, stage-2-modernization]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Fails only on real errors (undefined references, broken hook
      # usage, etc.), not on the pre-existing style warnings this
      # codebase had before linting was introduced — see eslint.config.js
      # for why that split is deliberate, not a loophole.
      - run: npm run lint

      - run: npm test

      # contracts/subscription-billing's own test suite — fully
      # self-contained (soroban-sdk's testutils run a local simulated
      # Soroban VM, no testnet/network dependency at all), unlike the
      # scripts/verify-* suites below, so this is a real, safe CI gate,
      # not just a manual/scheduled check. ubuntu-latest ships a Rust
      # toolchain already; only the wasm target needs adding.
      - name: Rust contract tests + wasm build
        run: |
          rustup target add wasm32v1-none
          cd contracts
          cargo test
          cargo build --target wasm32v1-none --release -p subscription-billing

      # Stage 3's tenant-isolation verification (scripts/verify-tenant-isolation.js)
      # spawns a real mongod itself — not mongodb-memory-server, see that
      # script's own header comment for why — so it needs a real mongod
      # binary on PATH. ubuntu-latest runners don't ship one by default.
      # NOTE: this install step follows MongoDB's own documented apt
      # instructions but has only been verified working against the
      # actual GitHub Actions environment by inspection, not a real run
      # of this workflow — watch the first CI run on this branch closely.
      - name: Install mongod
        run: |
          curl -fsSL https://pgp.mongodb.com/server-7.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server

      - run: npm run verify:tenant-isolation

      - run: npm run verify:stage-4-5

      # Stage 10's canteen load test — fully self-contained (own
      # disposable mongod, no external network dependency), unlike
      # verify:stage-6-8/verify:soroban-backend (real Stellar testnet)
      # or verify:stage-9 (needs the real school's data export, which
      # lives outside this repo, not in CI's checkout) — safe as a real
      # CI gate. This is the test that caught canteen.controller.js's
      # lost-update race under concurrent purchases; keeping it in CI
      # stops that regressing silently if the handler is ever touched
      # again.
      - run: npm run verify:stage-10-canteen-concurrency

      # High/critical only, so a new moderate-severity transitive advisory
      # (there will always be one eventually) doesn't block every PR —
      # matches what Stage 2 actually fixed vs. left as a known,
      # unfixable-from-here transitive issue (see the Stage 2.1 commit).
      - run: npm audit --audit-level=high
